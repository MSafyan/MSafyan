<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Muhammad Safyan, Full-Stack, AI and Data Engineer">
  <style>
    .chip { opacity: 0; animation: rise .7s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 66px 248px; }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 0; transform: scale(2.2); } }
    @media (prefers-reduced-motion: reduce) { .chip { animation: none; opacity: 1; } .pulse { animation: none; opacity: 0; } }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#d9d4ca"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0.45" stop-color="#fbfaf7" stop-opacity="1"/><stop offset="1" stop-color="#fbfaf7" stop-opacity="0"/></linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#fbfaf7"/>
    <rect x="600" width="600" height="300" fill="url(#dots)"/>
    <rect x="600" width="600" height="300" fill="url(#fade)"/>
    <rect width="6" height="300" fill="#b23c0d"/>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#e6e3dc" stroke-width="2"/>
  <text x="58" y="78" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3.5" fill="#b23c0d">FULL-STACK · AI · DATA ENGINEERING</text>
  <text x="56" y="146" font-family="Newsreader, ui-serif, Georgia, 'Times New Roman', serif" font-size="64" letter-spacing="-1" fill="#17171b">Muhammad Safyan</text>
  <text font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#55555f">
    <tspan x="58" y="190">Next.js and Node.js products, AI features that stay cheap to run,</tspan>
    <tspan x="58" y="218">and data pipelines that make every team's numbers agree.</tspan>
  </text>
  <circle class="pulse" cx="66" cy="248" r="6" fill="#1a7f37"/>
  <circle cx="66" cy="248" r="5" fill="#1a7f37"/>
  <text x="82" y="254" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16"><tspan fill="#17171b">Open to new projects</tspan><tspan dx="10" fill="#55555f">·</tspan><tspan dx="10" font-weight="600" fill="#b23c0d">muhammadsafyan.com →</tspan></text>
  <g class="chip" style="animation-delay:0.15s">
    <rect x="852" y="58" width="290" height="62" rx="12" fill="#ffffff" stroke="#e6e3dc"/>
    <text x="876" y="98"><tspan font-family="Newsreader, ui-serif, Georgia, 'Times New Roman', serif" font-size="30" fill="#b23c0d">95%</tspan><tspan dx="12" dy="-2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#55555f">lower LLM spend</tspan></text>
  </g>
  <g class="chip" style="animation-delay:0.30s">
    <rect x="852" y="134" width="290" height="62" rx="12" fill="#ffffff" stroke="#e6e3dc"/>
    <text x="876" y="174"><tspan font-family="Newsreader, ui-serif, Georgia, 'Times New Roman', serif" font-size="30" fill="#b23c0d">58x</tspan><tspan dx="12" dy="-2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#55555f">Google impressions</tspan></text>
  </g>
  <g class="chip" style="animation-delay:0.45s">
    <rect x="852" y="210" width="290" height="62" rx="12" fill="#ffffff" stroke="#e6e3dc"/>
    <text x="876" y="250"><tspan font-family="Newsreader, ui-serif, Georgia, 'Times New Roman', serif" font-size="30" fill="#b23c0d">50+</tspan><tspan dx="12" dy="-2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#55555f">data pipelines</tspan></text>
  </g>
</svg>
